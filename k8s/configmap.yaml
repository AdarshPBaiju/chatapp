apiVersion: v1
kind: ConfigMap
metadata:
  name: chatapp-config
  namespace: chatapp
data:
  DJANGO_ENV: "production"
  DB_HOST: "postgres-service"
  DB_PORT: "5432"
  DB_NAME: "chatapp"
  REDIS_HOST: "redis-service"
  REDIS_PORT: "6379"
  MINIO_HOST: "minio-service"
  MINIO_PORT: "9000"
  MINIO_BUCKET_NAME: "chatapp"
  KAFKA_BOOTSTRAP_SERVERS: "kafka-service:9092"
  ALLOWED_HOSTS: "chatapp.example.com,www.chatapp.example.com"
  CORS_ALLOWED_ORIGINS: "https://chatapp.example.com,https://www.chatapp.example.com"