apiVersion: apps/v1
kind: Deployment
metadata:
  name: go-risk
  namespace: chatapp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: go-risk
  template:
    metadata:
      labels:
        app: go-risk
    spec:
      containers:
      - name: go-risk
        image: ghcr.io/adarshpbaiju/chatapp-go-risk:latest
        ports:
        - containerPort: 8082
        envFrom:
        - configMapRef:
            name: chatapp-config
        - secretRef:
            name: chatapp-secret
        resources:
          limits:
            memory: "256Mi"
            cpu: "200m"
          requests:
            memory: "128Mi"
            cpu: "100m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8082
          initialDelaySeconds: 5
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: go-risk-service
  namespace: chatapp
spec:
  selector:
    app: go-risk
  ports:
    - protocol: TCP
      port: 8082
      targetPort: 8082
