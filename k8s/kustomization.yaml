apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: chatapp

resources:
- namespace.yaml
- configmap.yaml
- secret.yaml
- postgres.yaml
- redis.yaml
- minio.yaml
- kafka.yaml
- backend.yaml
- celery.yaml

images:
- name: your-registry/chatapp-backend
  newName: ghcr.io/adarshpbaiju/chatapp-backend
  newTag: sha-8ab676b

commonLabels:
  app: chatapp

configMapGenerator:
- literals:
  - DJANGO_ENV=production
  - DB_HOST=postgres-service
  - DB_PORT=5432
  - REDIS_HOST=redis-service
  - REDIS_PORT=6379
  - MINIO_HOST=minio-service
  - MINIO_PORT=9000
  name: chatapp-config
