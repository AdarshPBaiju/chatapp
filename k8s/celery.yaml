apiVersion: apps/v1
kind: Deployment
metadata:
  name: celery-worker
  namespace: chatapp
spec:
  replicas: 2
  selector:
    matchLabels:
      app: celery-worker
  template:
    metadata:
      labels:
        app: celery-worker
    spec:
      containers:
      - name: celery-worker
        image: your-registry/chatapp-backend:latest
        envFrom:
        - configMapRef:
            name: chatapp-config
        - secretRef:
            name: chatapp-secrets
        env:
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: chatapp-secrets
              key: POSTGRES_USER
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: chatapp-secrets
              key: POSTGRES_PASSWORD
        - name: MINIO_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: chatapp-secrets
              key: MINIO_ACCESS_KEY
        - name: MINIO_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: chatapp-secrets
              key: MINIO_SECRET_KEY
        command: ["celery", "-A", "chatapp", "worker", "--loglevel=info"]
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: celery-beat
  namespace: chatapp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: celery-beat
  template:
    metadata:
      labels:
        app: celery-beat
    spec:
      containers:
      - name: celery-beat
        image: your-registry/chatapp-backend:latest
        envFrom:
        - configMapRef:
            name: chatapp-config
        - secretRef:
            name: chatapp-secrets
        env:
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: chatapp-secrets
              key: POSTGRES_USER
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: chatapp-secrets
              key: POSTGRES_PASSWORD
        - name: MINIO_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: chatapp-secrets
              key: MINIO_ACCESS_KEY
        - name: MINIO_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: chatapp-secrets
              key: MINIO_SECRET_KEY
        command: ["celery", "-A", "chatapp", "beat", "--loglevel=info", "--scheduler", "django_celery_beat.schedulers:DatabaseScheduler"]
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "100m"