services:
  gateway:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/gateway.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - chatapp_network

  db:
    image: postgres:15
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - chatapp_network

  pgadmin:
    image: dpage/pgadmin4
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@chatapp.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    networks:
      - chatapp_network

  redis:
    image: redis:7-alpine
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - chatapp_network

  minio:
    image: minio/minio
    environment:
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 30s
      timeout: 20s
      retries: 3
    ports:
      - "9000:9000"
      - "9001:9001"
    networks:
      - chatapp_network

  minio-init:
    image: minio/mc
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
    volumes:
      - ./scripts/minio_init.sh:/minio_init.sh
    entrypoint: ["/bin/sh", "/minio_init.sh"]
    networks:
      - chatapp_network

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - chatapp_network

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
      KAFKA_ZOOKEEPER_SESSION_TIMEOUT_MS: 6000
    healthcheck:
      test: [ "CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092" ]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - chatapp_network

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    ports:
      - "8085:8080"
    depends_on:
      - kafka
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    networks:
      - chatapp_network

  kafka-init:
    image: confluentinc/cp-kafka:7.6.0
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: [ "/bin/sh", "-c" ]
    command: |
      "
      echo 'Waiting for Kafka...'
      kafka-topics --bootstrap-server kafka:29092 --list

      echo 'Creating topics...'
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic security_events --partitions 3 --replication-factor 1
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic chat.inbound --partitions 6 --replication-factor 1
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic chat.delivery --partitions 6 --replication-factor 1
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic chat.receipts --partitions 6 --replication-factor 1
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic user_events --partitions 3 --replication-factor 1
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic enrichment_events --partitions 3 --replication-factor 1
      echo 'All Kafka topics ready.'
      "
    networks:
      - chatapp_network

  backend:
    build: ./backend
    environment:
      DJANGO_ENV: ${DJANGO_ENV}
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MINIO_INTERNAL_URL: ${MINIO_INTERNAL_URL}
      MINIO_EXTERNAL_URL: ${MINIO_EXTERNAL_URL}
      MINIO_BUCKET_NAME: ${MINIO_BUCKET_NAME}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      SECRET_KEY: ${SECRET_KEY}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      GO_AUTH_ENABLED: "true"
      GO_AUTH_VERIFY_URL: http://go-auth:${GO_AUTH_PORT:-8080}/api/v1/verify
      GO_AUTH_TIMEOUT_SECONDS: 2
      GO_AUTH_FALLBACK_TO_LOCAL: "true"
      GO_INTERNAL_SERVICE_SECRET: ${GO_INTERNAL_SERVICE_SECRET}
      ADMIN_URL: ${ADMIN_URL}
      MAX_DEVICES_PER_USER: ${MAX_DEVICES_PER_USER}
      RUN_MIGRATIONS: "true"
    command: uvicorn config.asgi:application --host 0.0.0.0 --port 8000 --workers 4
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - chatapp_network
    ports:
      - "8000:8000"

  go-auth:
    build:
      context: .
      dockerfile: services/go/go-auth/Dockerfile
    ports:
      - "8080:8080"
    environment:
      SERVICE_NAME: go-auth
      SERVICE_PORT: ${GO_AUTH_PORT:-8080}
      INTERNAL_SERVICE_SECRET: ${GO_INTERNAL_SERVICE_SECRET}
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_URL: ${REDIS_URL}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      AUTH_TOKEN_ACTIVE_KID: ${AUTH_TOKEN_ACTIVE_KID:-v1}
      AUTH_TOKEN_KEYRING: ${AUTH_TOKEN_KEYRING:-{"v1":{"signing_seed":"development-signing-seed","encryption_key":"development-encryption-key"}}}
      GO_AUTH_SESSION_ACTIVITY_GRACE_SECONDS: 300
    healthcheck:
      test: [ "CMD", "wget", "-qO-", "http://localhost:${GO_AUTH_PORT:-8080}/health" ]
      interval: 15s
      timeout: 5s
      retries: 3
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - chatapp_network

  go-enrichment:
    build:
      context: .
      dockerfile: services/go/go-enrichment/Dockerfile
    ports:
      - "8081:8081"
    environment:
      SERVICE_NAME: go-enrichment
      SERVICE_PORT: ${GO_ENRICHMENT_PORT:-8081}
      INTERNAL_SERVICE_SECRET: ${GO_INTERNAL_SERVICE_SECRET}
      REDIS_URL: ${REDIS_URL}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
    healthcheck:
      test: [ "CMD", "wget", "-qO-", "http://localhost:${GO_ENRICHMENT_PORT:-8081}/health" ]
      interval: 15s
      timeout: 5s
      retries: 3
    depends_on:
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - chatapp_network

  go-risk:
    build:
      context: .
      dockerfile: services/go/go-risk/Dockerfile
    ports:
      - "8082:8082"
    environment:
      SERVICE_NAME: go-risk
      SERVICE_PORT: ${GO_RISK_PORT:-8082}
      INTERNAL_SERVICE_SECRET: ${GO_INTERNAL_SERVICE_SECRET}
      REDIS_URL: ${REDIS_URL}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
    healthcheck:
      test: [ "CMD", "wget", "-qO-", "http://localhost:${GO_RISK_PORT:-8082}/health" ]
      interval: 15s
      timeout: 5s
      retries: 3
    depends_on:
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - chatapp_network

  go-chat:
    build:
      context: .
      dockerfile: services/go/go-chat/Dockerfile
    ports:
      - "8083:8083"
    environment:
      SERVICE_NAME: go-chat
      SERVICE_PORT: ${GO_CHAT_PORT:-8083}
      INTERNAL_SERVICE_SECRET: ${GO_INTERNAL_SERVICE_SECRET}
      GO_AUTH_URL: http://go-auth:${GO_AUTH_PORT:-8080}
      REDIS_URL: ${REDIS_URL}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
    healthcheck:
      test: [ "CMD", "wget", "-qO-", "http://localhost:${GO_CHAT_PORT:-8083}/health" ]
      interval: 15s
      timeout: 5s
      retries: 3
    depends_on:
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - chatapp_network

  go-media:
    build:
      context: .
      dockerfile: services/go/go-media/Dockerfile
    ports:
      - "8084:8084"
    environment:
      SERVICE_NAME: go-media
      SERVICE_PORT: ${GO_MEDIA_PORT:-8084}
      INTERNAL_SERVICE_SECRET: ${GO_INTERNAL_SERVICE_SECRET}
      GO_AUTH_URL: http://go-auth:${GO_AUTH_PORT:-8080}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET_NAME: ${MINIO_BUCKET_NAME}
      MINIO_EXTERNAL_URL: ${MINIO_EXTERNAL_URL}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
    healthcheck:
      test: [ "CMD", "wget", "-qO-", "http://localhost:${GO_MEDIA_PORT:-8084}/health" ]
      interval: 15s
      timeout: 5s
      retries: 3
    depends_on:
      minio:
        condition: service_healthy
      kafka:
        condition: service_healthy
      go-auth:
        condition: service_healthy
    networks:
      - chatapp_network

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - chatapp_network

  celery:
    build: ./backend
    environment:
      DJANGO_ENV: ${DJANGO_ENV}
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MINIO_INTERNAL_URL: ${MINIO_INTERNAL_URL}
      MINIO_EXTERNAL_URL: ${MINIO_EXTERNAL_URL}
      MINIO_BUCKET_NAME: ${MINIO_BUCKET_NAME}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      SECRET_KEY: ${SECRET_KEY}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      ADMIN_URL: ${ADMIN_URL}
      MAX_DEVICES_PER_USER: ${MAX_DEVICES_PER_USER}
    command: celery -A config worker --loglevel=info
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - chatapp_network

  celery-beat:
    build: ./backend
    environment:
      DJANGO_ENV: ${DJANGO_ENV}
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MINIO_INTERNAL_URL: ${MINIO_INTERNAL_URL}
      MINIO_EXTERNAL_URL: ${MINIO_EXTERNAL_URL}
      MINIO_BUCKET_NAME: ${MINIO_BUCKET_NAME}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      SECRET_KEY: ${SECRET_KEY}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      ADMIN_URL: ${ADMIN_URL}
      MAX_DEVICES_PER_USER: ${MAX_DEVICES_PER_USER}
    command: celery -A config beat --loglevel=info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - chatapp_network

  flower:
    build: ./backend
    environment:
      DJANGO_ENV: ${DJANGO_ENV}
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MINIO_INTERNAL_URL: ${MINIO_INTERNAL_URL}
      MINIO_EXTERNAL_URL: ${MINIO_EXTERNAL_URL}
      MINIO_BUCKET_NAME: ${MINIO_BUCKET_NAME}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      SECRET_KEY: ${SECRET_KEY}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      ADMIN_URL: ${ADMIN_URL}
      MAX_DEVICES_PER_USER: ${MAX_DEVICES_PER_USER}
    command: celery -A config flower --port=5555 --basic_auth=${FLOWER_USER:-admin}:${FLOWER_PASSWORD:-admin}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - chatapp_network

  chat-worker:
    build: ./backend
    environment:
      DJANGO_ENV: ${DJANGO_ENV}
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MINIO_INTERNAL_URL: ${MINIO_INTERNAL_URL}
      MINIO_EXTERNAL_URL: ${MINIO_EXTERNAL_URL}
      MINIO_BUCKET_NAME: ${MINIO_BUCKET_NAME}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      SECRET_KEY: ${SECRET_KEY}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      ADMIN_URL: ${ADMIN_URL}
      MAX_DEVICES_PER_USER: ${MAX_DEVICES_PER_USER}
    command: python manage.py consume_chat
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - chatapp_network

volumes:
  postgres_data:
  minio_data:

networks:
  chatapp_network:
    driver: bridge
