name: ci

on:
  push:
    branches: ["**"]
    paths:
      - "backend/**"
      - "services/go/**"
      - "pyproject.toml"
      - "go.mod"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: ["**"]
    paths:
      - "backend/**"
      - "services/go/**"
      - "pyproject.toml"
      - "go.mod"
      - ".github/workflows/ci.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DJANGO_SETTINGS_MODULE: config.settings.ci

jobs:
  django:
    name: django-tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: chatapp_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: install
        run: pip install --no-cache-dir -r requirements.txt

      - name: migrations-check
        run: python manage.py makemigrations --check --dry-run

      - name: system-check
        run: python manage.py check --fail-level ERROR

      - name: migrate
        run: python manage.py migrate --noinput

      - name: test
        run: |
          coverage run manage.py test apps/users apps/authentication core --verbosity=2
          coverage xml -o coverage.xml
          coverage report --fail-under=70

      - name: coverage-summary
        if: always()
        run: |
          echo "### Django Test Coverage Summary" >> $GITHUB_STEP_SUMMARY
          coverage report >> $GITHUB_STEP_SUMMARY

      - uses: codecov/codecov-action@v4
        if: always()
        with:
          files: backend/coverage.xml
          flags: backend
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: AdarshPBaiju/chatapp

  go:
    name: go-tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/go

    steps:
      - uses: actions/checkout@v4

      - name: setup-go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true
          cache-dependency-path: services/go/go.sum

      - name: install-deps
        run: go mod download

      - name: build
        run: go build ./...

      - name: test
        run: go test -v -race ./...

      - name: test-coverage
        run: go test -v -coverprofile=coverage.out ./...

      - name: coverage-summary
        if: always()
        run: |
          echo "### Go Test Coverage Summary" >> $GITHUB_STEP_SUMMARY
          go tool cover -func=coverage.out >> $GITHUB_STEP_SUMMARY

      - uses: codecov/codecov-action@v4
        if: always()
        with:
          files: services/go/coverage.out
          flags: go
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: AdarshPBaiju/chatapp
