name: deploy

on:
  workflow_run:
    workflows: ["docker"]
    types:
      - completed
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to deploy (e.g. sha-abc1234)"
        required: true
        type: string
      environment:
        description: "Target environment"
        required: true
        default: staging
        type: choice
        options:
          - staging
          - production

concurrency:
  group: deploy-${{ inputs.environment || 'staging' }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: read
  deployments: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/chatapp-backend

jobs:
  resolve-tag:
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      image: ${{ steps.resolve.outputs.image }}

    steps:
      - id: resolve
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.tag }}" >> $GITHUB_OUTPUT
          else
            SHA="${{ github.event.workflow_run.head_sha }}"
            echo "tag=sha-${SHA:0:7}" >> $GITHUB_OUTPUT
          fi
          
          # Normalize image name to lowercase for GHCR
          IMAGE_LOWER=$(echo "${{ env.REGISTRY }}/${{ github.repository_owner }}/chatapp-backend" | tr '[:upper:]' '[:lower:]')
          echo "image=$IMAGE_LOWER" >> $GITHUB_OUTPUT

  deploy:
    needs: resolve-tag
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.environment || 'staging' }}
      url: ${{ (inputs.environment == 'production') && 'https://chatapp.example.com' || 'https://staging.chatapp.example.com' }}
    
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: imranismail/setup-kustomize@v2

      - name: manifest-patch
        run: |
          cd k8s
          kustomize edit set image \
            your-registry/chatapp-backend=${{ needs.resolve-tag.outputs.image }}:${{ needs.resolve-tag.outputs.tag }}

      - id: commit
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "deploy(${{ inputs.environment || 'staging' }}): ${{ needs.resolve-tag.outputs.tag }}"
          file_pattern: "k8s/kustomization.yaml"

      - name: wait-for-rollout
        env:
          BASE: ${{ (inputs.environment == 'production') && (vars.PRODUCTION_URL || secrets.PRODUCTION_URL) || (vars.STAGING_URL || secrets.STAGING_URL) }}
        run: |
          if [ -z "$BASE" ]; then
            echo "::warning title=Missing Host::Deployment host URL not configured — skipping health checks"
            exit 0
          fi
          
          echo "Waiting for rollout at $BASE..."
          for i in $(seq 1 30); do
            status=$(curl -s -o /dev/null -w "%{http_code}" "${BASE%/}/health/" || true)
            if [ "$status" = "200" ]; then
              echo "Health check passed!"
              exit 0
            fi
            echo "Attempt $i — got $status, retrying in 10s"
            sleep 10
          done
          echo "Health check timed out" && exit 1

      - name: smoke-test
        env:
          BASE: ${{ (inputs.environment == 'production') && (vars.PRODUCTION_URL || secrets.PRODUCTION_URL) || (vars.STAGING_URL || secrets.STAGING_URL) }}
        if: success()
        run: |
          if [ -z "$BASE" ]; then exit 0; fi
          
          check() {
            local path="$1"
            local expected="$2"
            local target="${BASE%/}$path"
            local status
            status=$(curl -s -o /dev/null -w "%{http_code}" "$target")
            if [ "$status" != "$expected" ]; then
              echo "::error file=deploy.yml::FAIL $target — expected $expected got $status" && exit 1
            fi
            echo "OK   $target ($status)"
          }

          check "/health/" 200
          check "/api/" 401

      - name: summary
        if: always()
        run: |
          echo "## Deployment Summary (${{ inputs.environment || 'staging' }})" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| **Status** | ${{ job.status }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Environment** | \`${{ inputs.environment || 'staging' }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Image Tag** | \`${{ needs.resolve-tag.outputs.tag }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Registry** | \`${{ env.REGISTRY }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Commit** | ${{ steps.commit.outputs.commit_hash || 'No changes' }} |" >> $GITHUB_STEP_SUMMARY
          
          BASE="${{ (inputs.environment == 'production') && (vars.PRODUCTION_URL || secrets.PRODUCTION_URL) || (vars.STAGING_URL || secrets.STAGING_URL) }}"
          if [ ! -z "$BASE" ]; then
            echo "| **URL** | [$BASE]($BASE) |" >> $GITHUB_STEP_SUMMARY
          fi
