name: security

on:
  push:
    branches:
      - main
      - master
    paths:
      - "backend/requirements.txt"
      - "backend/Dockerfile"
      - ".github/workflows/security.yml"
  pull_request:
    paths:
      - "backend/requirements.txt"
      - "backend/Dockerfile"
      - ".github/workflows/security.yml"
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

jobs:
  deps:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: install
        run: pip install --no-cache-dir -r requirements.txt pip-audit

      - name: audit
        run: pip-audit --requirement requirements.txt --format=cyclonedx-json --output=pip-audit.json || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pip-audit-report
          path: backend/pip-audit.json
          retention-days: 30

  trivy:
    runs-on: ubuntu-latest
    needs: deps

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: build
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          load: true
          tags: chatapp-backend:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: aquasecurity/trivy-action@master
        with:
          image-ref: chatapp-backend:scan
          format: sarif
          output: trivy.sarif
          severity: CRITICAL,HIGH
          exit-code: "0"

      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy.sarif
          category: trivy

  k8s:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: validate
        uses: docker://ghcr.io/yannh/kubeconform:latest
        with:
          entrypoint: /kubeconform
          args: >-
            -strict
            -summary
            -ignore-filename-pattern kustomization.yaml
            -schema-location default
            -schema-location https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json
            k8s/
