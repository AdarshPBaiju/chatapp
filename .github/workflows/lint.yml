name: lint

on:
  push:
    branches: ["**"]
    paths:
      - "backend/**"
      - "services/go/**"
      - "pyproject.toml"
      - "go.mod"
      - ".github/workflows/lint.yml"
  pull_request:
    branches: ["**"]
    paths:
      - "backend/**"
      - "services/go/**"
      - "pyproject.toml"
      - "go.mod"
      - ".github/workflows/lint.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: fix
        uses: astral-sh/ruff-action@v3
        with:
          args: "check --fix --unsafe-fixes --output-format=github"
          src: "./backend"

      - name: format
        uses: astral-sh/ruff-action@v3
        with:
          args: "format"
          src: "./backend"

      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "style: ruff autofix"
          file_pattern: "backend/**/*.py"

  golangci:
    name: lint-go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: false
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          working-directory: services/go
